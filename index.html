<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fudget</title>
<style>
  :root { color-scheme: light dark; --line: #8884; --muted: #8889; --accent: #2563eb; --bad: #dc2626; --good: #16a34a; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 16px/1.4 system-ui, sans-serif; background: Canvas; color: CanvasText; }
  header { position: sticky; top: 0; z-index: 1; background: Canvas; padding: 10px 16px 0; border-bottom: 1px solid var(--line); }
  .top { display: flex; align-items: center; gap: 8px; }
  h1 { font-size: 1.1rem; margin: 0; flex: 1; }
  nav { display: flex; gap: 4px; overflow-x: auto; padding: 8px 0; }
  nav button { flex: none; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: none; color: inherit; font: inherit; }
  nav button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { padding: 8px 16px 48px; max-width: 720px; margin: auto; }
  section { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
  h2 { font-size: 1rem; margin: 0 0 8px; display: flex; gap: 8px; align-items: center; }
  h2 select { margin-left: auto; }
  label { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 6px 0; }
  label > span { opacity: .8; }
  input, select { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: none; color: inherit; min-width: 0; }
  input[type=number] { width: 8.5em; text-align: right; }
  input[type=checkbox] { width: 1.3em; height: 1.3em; }
  .row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 4px; margin: 4px 0 10px; align-items: center; }
  .row.alloc { grid-template-columns: 1fr 6em 6.5em auto; margin-bottom: 4px; }
  .row input[type=number] { width: 100%; }
  .row .wide { grid-column: 1 / -1; display: flex; gap: 4px; }
  .row .wide > * { flex: 1; }
  button.small { font: inherit; font-size: .85rem; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: none; color: inherit; }
  table { width: 100%; border-collapse: collapse; font-size: .92rem; font-variant-numeric: tabular-nums; }
  td, th { padding: 4px 2px; text-align: right; border-bottom: 1px solid var(--line); }
  td:first-child, th:first-child { text-align: left; }
  tr.sub td { opacity: .7; font-size: .85rem; }
  tr.total td { font-weight: 600; }
  .neg { color: var(--bad); } .pos { color: var(--good); }
  .note { font-size: .85rem; opacity: .7; margin: 6px 0; }
  details > summary { cursor: pointer; font-weight: 600; padding: 2px 0; }
  details[open] > summary { margin-bottom: 8px; }
  .menu { display: flex; gap: 6px; flex-wrap: wrap; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Fudget</h1>
    <select id="year" aria-label="Tax year"></select>
  </div>
  <nav id="tabs"></nav>
</header>
<main id="view"></main>
<script type="module">
import * as B from './budget.js';
import { FUNDS } from './funds.js';
import { fillWorkbook, workbookCells } from './sheet.js';

const KEY = 'fudget-v1';
const CYCLES = ['weekly', 'fortnightly', 'monthly', 'quarterly', 'yearly'];
const HORIZONS = [1, 3, 5];

// Sample numbers so the app works on first open. Your own figures live only on your device.
const DEFAULTS = {
  year: '2026-27',
  tab: 'budget',
  members: [
    { id: 'p1', name: 'P1', salaryPackage: 90000, hecs: false, sacrifice: 0, bankStart: 10000, bankRate: 0.05, taxInterest: true, fund: 0, superStart: 0, superReturn: 0.07, show: 'monthly' },
    { id: 'p2', name: 'P2', salaryPackage: 70000, hecs: true, sacrifice: 0, bankStart: 5000, bankRate: 0.05, taxInterest: true, fund: 0, superStart: 0, superReturn: 0.07, show: 'fortnightly' },
  ],
  active: 0,
  scenarios: [{
    name: 'Current Budget', split: 'income', pool: false, sharedIncome: 'income', withSacrifice: false,
    roommate: { mode: 'none', amount: 0, cycle: 'weekly' },
    costs: [
      { name: 'Rent / Mortgage', owner: '', amount: 2400, cycle: 'monthly' },
      { name: 'Electricity', owner: '', amount: 115, cycle: 'monthly' },
      { name: 'Internet', owner: '', amount: 85, cycle: 'monthly' },
      { name: 'Groceries', owner: '', amount: 250, cycle: 'weekly' },
      { name: 'Phone', owner: 'p1', amount: 50, cycle: 'monthly' },
      { name: 'Car rego', owner: 'p1', amount: 900, cycle: 'yearly' },
    ],
    allocations: [
      { name: 'General', amount: 600, kind: 'cost' },
      { name: 'Shared Account', amount: 600, kind: 'cost' },
      { name: 'Savings', amount: 1500, kind: 'saving' },
      { name: 'Investments', amount: 0, kind: 'saving' },
      { name: 'Gifts', amount: 100, kind: 'saving' },
      { name: 'FU Money', amount: 300, kind: 'saving' },
    ],
  }],
  house: { value: 600000, depositPct: 0.05, govPct: 0, firstHome: true, rate: 0.0549, years: 30, rego: 121.4, title: 36.2, conveyancing: 2000, stocks: 0, gift: 0, extras: 0, cushion: 0, buyIn: 1, useSacrifice: true },
  goals: { emergencyMonths: 6, extra: 1000 },
};

let S = load();
function load() {
  try { return { ...structuredClone(DEFAULTS), ...JSON.parse(localStorage.getItem(KEY)) }; } catch { return structuredClone(DEFAULTS); }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }

// --- helpers ---------------------------------------------------------------
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const get = path => path.split('.').reduce((o, k) => o?.[k], S);
const set = (path, v) => { const ks = path.split('.'), last = ks.pop(); ks.reduce((o, k) => o[k], S)[last] = v; };
const $ = (n, signed) => (n = n || 0, `<span class="${signed && n < 0 ? 'neg' : ''}">${n.toLocaleString('en-AU', { style: 'currency', currency: 'AUD', maximumFractionDigits: n !== 0 && Math.abs(n) < 100 ? 2 : 0 })}</span>`);
const pct = n => `${(n * 100).toFixed(1)}%`;
const opts = (list, cur) => list.map(([v, t]) => `<option value="${esc(v)}" ${String(v) === String(cur) ? 'selected' : ''}>${esc(t)}</option>`).join('');
const num = (k, label, step = 'any') => `<label><span>${label}</span><input type="number" inputmode="decimal" step="${step}" data-k="${k}" value="${get(k) ?? 0}"></label>`;
const pctIn = (k, label) => `<label><span>${label}</span><input type="number" inputmode="decimal" step="0.01" data-k="${k}" data-pct value="${+(get(k) * 100).toFixed(4)}"></label>`;
const chk = (k, label) => `<label><span>${label}</span><input type="checkbox" data-k="${k}" ${get(k) ? 'checked' : ''}></label>`;
const sel = (k, label, list) => `<label><span>${label}</span><select data-k="${k}">${opts(list, get(k))}</select></label>`;
const cycleSel = k => `<select data-k="${k}" aria-label="Cycle">${opts(CYCLES.map(c => [c, c]), get(k))}</select>`;
const rows = (list, total) => `<table>${list.map(([l, v, cls = '']) => `<tr class="${cls}"><td>${l}</td><td>${typeof v === 'number' ? $(v, true) : v}</td></tr>`).join('')}${total ?? ''}</table>`;

const scn = () => S.scenarios[S.active] ?? S.scenarios[0];
const memberName = id => S.members.find(m => m.id === id)?.name ?? 'Shared';
const fund = m => FUNDS[m.fund] ?? FUNDS[0];
const pay = (m, withSac) => B.takeHome({ ...m, sacrifice: withSac ? m.sacrifice : 0 }, S.year);

// Turn a Scenario into budget entries; Income flows from each Member's take-home pay.
function entries(sc) {
  const list = S.members.map(m => ({ name: 'Take-home', kind: 'income', owner: m.id, amount: pay(m, sc.withSacrifice).takeHome, cycle: 'yearly' }));
  const rm = sc.roommate;
  if (rm.mode === 'income') list.push({ name: 'Roommate', kind: 'income', owner: null, amount: rm.amount, cycle: rm.cycle });
  if (rm.mode === 'costs') list.push({ name: 'Roommate', kind: 'cost', owner: null, amount: -rm.amount, cycle: rm.cycle });
  for (const c of sc.costs) list.push({ ...c, kind: 'cost', owner: c.owner || null });
  for (const a of sc.allocations) list.push({ ...a, owner: null, cycle: 'monthly', alloc: true });
  return list;
}
const budget = sc => { const e = entries(sc); return { shares: B.shares(e, sc), sum: B.summarize(e, sc) }; };

// --- tabs ------------------------------------------------------------------
const TABS = {
  income: {
    title: 'Income',
    form: () => S.members.map((m, i) => `<section>
      <h2><input data-k="members.${i}.name" value="${esc(m.name)}" aria-label="Name"></h2>
      ${num(`members.${i}.salaryPackage`, 'Salary package (yearly, incl. super)')}
      ${chk(`members.${i}.hecs`, 'HECS / HELP debt')}
      ${num(`members.${i}.sacrifice`, 'Salary sacrifice to super (monthly)')}
      <div data-out="income-${i}"></div></section>`).join(''),
    out: () => Object.fromEntries(S.members.map((m, i) => {
      const a = pay(m, false), b = pay(m, true);
      const line = (label, k, sign = 1) => `<tr><td>${label}</td><td>${$(sign * a[k], true)}</td><td>${$(sign * b[k], true)}</td></tr>`;
      return [`income-${i}`, `<table><tr><th></th><th>No sacrifice</th><th>Sacrifice</th></tr>
        ${line('Base salary', 'base')}${line('Income tax', 'tax', -1)}${line('Low income offset', 'lito')}
        ${line('Medicare levy', 'medicare', -1)}${line('HECS / HELP', 'hecs', -1)}
        <tr class="total"><td>Take-home / year</td><td>${$(a.takeHome)}</td><td>${$(b.takeHome)}</td></tr>
        <tr class="sub"><td>per month</td><td>${$(a.takeHome / 12)}</td><td>${$(b.takeHome / 12)}</td></tr>
        <tr class="sub"><td>per fortnight</td><td>${$(a.takeHome / 26)}</td><td>${$(b.takeHome / 26)}</td></tr>
        ${line('Super in (after 15% tax)', 'superNet')}</table>
        <p class="note">Marginal rate ${pct(B.marginalRate(b.base - m.sacrifice * 12, S.year))}. Sacrifice costs ${$((a.takeHome - b.takeHome) / 12)}/month in take-home and adds ${$((b.superNet - a.superNet) / 12)}/month to super.</p>`];
    })),
  },

  budget: {
    title: 'Budget',
    form: () => {
      const sc = scn(), base = `scenarios.${S.active}`;
      const owners = [['', 'Shared'], ...S.members.map(m => [m.id, m.name])];
      return `<section><h2>Variation
          <select data-act="pick" aria-label="Variation">${opts(S.scenarios.map((s, i) => [i, s.name]), S.active)}</select></h2>
        <label><span>Name</span><input data-k="${base}.name" value="${esc(sc.name)}"></label>
        <div class="menu"><button class="small" data-act="dupScenario">Duplicate as new variation</button>
          ${S.scenarios.length > 1 ? '<button class="small" data-act="delScenario">Delete this variation</button>' : ''}</div></section>
      <div data-out="budget"></div>
      <section><details data-d="settings"><summary>Settings</summary>
        ${sel(`${base}.split`, 'Split shared costs', [['income', 'By income share'], ['equal', 'Equally'], ['none', 'Not split']])}
        ${chk(`${base}.pool`, 'Pool personal costs too (all joint)')}
        ${chk(`${base}.withSacrifice`, 'Budget on take-home after sacrifice')}
        ${sel(`${base}.roommate.mode`, 'Roommate', [['none', 'No roommate'], ['income', 'Add rent to income'], ['costs', 'Take rent off costs']])}
        ${sc.roommate.mode === 'none' ? '' : `<label><span>Roommate rent</span><span><input type="number" inputmode="decimal" data-k="${base}.roommate.amount" value="${sc.roommate.amount}"> ${cycleSel(`${base}.roommate.cycle`)}</span></label>`}
        ${sc.roommate.mode === 'income' ? sel(`${base}.sharedIncome`, 'Share rent out', [['income', 'By income share'], ['equal', 'Equally'], ['none', 'Keep at household']]) : ''}
      </details></section>
      <section><details data-d="costs"><summary>Costs (${sc.costs.length})</summary>
        ${sc.costs.map((c, i) => `<div class="row">
          <div class="wide"><input data-k="${base}.costs.${i}.name" value="${esc(c.name)}" aria-label="Cost name">
            <select data-k="${base}.costs.${i}.owner" aria-label="Who pays">${opts(owners, c.owner)}</select></div>
          <input type="number" inputmode="decimal" data-k="${base}.costs.${i}.amount" value="${c.amount}" aria-label="Amount">
          ${cycleSel(`${base}.costs.${i}.cycle`)}
          <button class="small" data-act="del" data-list="${base}.costs" data-i="${i}" aria-label="Remove ${esc(c.name)}">✕</button></div>`).join('')}
        <button class="small" data-act="add" data-list="${base}.costs">+ Add cost</button></details></section>
      <section><details data-d="allocs"><summary>Monthly allocations (${sc.allocations.length})</summary>
        <p class="note">Household totals each month, split like shared costs. Spending counts as a cost, saving as a savings goal.</p>
        ${sc.allocations.map((a, i) => `<div class="row alloc">
          <input data-k="${base}.allocations.${i}.name" value="${esc(a.name)}" aria-label="Allocation name">
          <input type="number" inputmode="decimal" data-k="${base}.allocations.${i}.amount" value="${a.amount}" aria-label="Monthly amount">
          <select data-k="${base}.allocations.${i}.kind" aria-label="Type">${opts([['cost', 'Spending'], ['saving', 'Saving']], a.kind)}</select>
          <button class="small" data-act="del" data-list="${base}.allocations" data-i="${i}" aria-label="Remove ${esc(a.name)}">✕</button></div>`).join('')}
        <button class="small" data-act="add" data-list="${base}.allocations">+ Add allocation</button></details></section>`;
    },
    out: () => {
      const { shares, sum } = budget(scn()), h = sum.household;
      const household = `<section><h2>Household (monthly)</h2>${rows([
        ['Income', h.income], ['Costs', -h.costs], ['Savings goals', -h.savings],
        ['Left over', h.leftOver, 'total'], [`Costs + savings use ${pct((h.costs + h.savings) / (h.income || 1))} of income`, '', 'sub']])}</section>`;
      const people = S.members.map((m, i) => {
        const show = n => B.fromMonthly(n, m.show), share = e => e.byMember[m.id] ?? 0;
        let left = shares.filter(e => e.kind === 'income').reduce((a, e) => a + share(e), 0);
        const bills = shares.filter(e => e.kind === 'cost' && !e.alloc).reduce((a, e) => a + share(e), 0);
        const lines = [['Income', show(left)], ['Bills', -show(bills)]];
        left -= bills;
        lines.push(['Remainder', show(left), 'sub']);
        for (const e of shares.filter(e => e.alloc)) { left -= share(e); lines.push([esc(e.name), -show(share(e))], ['Remainder', show(left), 'sub']); }
        lines[lines.length - 1][2] = 'total';
        return `<section><h2>${esc(m.name)} ${cycleSel(`members.${i}.show`)}</h2>${rows(lines)}</section>`;
      }).join('');
      const compare = S.scenarios.length < 2 ? '' : `<section><h2>Compare variations (monthly left over)</h2><table>
        <tr><th></th><th>Household</th>${S.members.map(m => `<th>${esc(m.name)}</th>`).join('')}</tr>
        ${S.scenarios.map(sc => { const s = budget(sc).sum; return `<tr><td>${esc(sc.name)}</td><td>${$(s.household.leftOver, true)}</td>${S.members.map(m => `<td>${$(s.members[m.id]?.leftOver ?? 0, true)}</td>`).join('')}</tr>`; }).join('')}
      </table></section>`;
      return { budget: household + people + compare };
    },
  },

  savings: {
    title: 'Savings',
    form: () => S.members.map((m, i) => `<section><h2>${esc(m.name)}</h2>
      ${num(`members.${i}.bankStart`, 'Bank balance now')}
      ${pctIn(`members.${i}.bankRate`, 'Bank interest % p.a.')}
      ${chk(`members.${i}.taxInterest`, 'Tax interest at marginal rate')}
      ${sel(`members.${i}.fund`, 'Super fund', FUNDS.map((f, j) => [j, f.name]))}
      ${fund(m).returns ? '' : pctIn(`members.${i}.superReturn`, 'Expected super return % p.a.')}
      ${num(`members.${i}.sacrifice`, 'Salary sacrifice (monthly)')}
      <div data-out="savings-${i}"></div></section>`).join('') + `<p class="note">Monthly savings come from each person's share of the active budget's savings goals (${esc(scn().name)}). Fund returns are past averages to June 2023, not a forecast.</p>`,
    out: () => Object.fromEntries(S.members.map((m, i) => {
      const { shares } = budget(scn());
      const saving = shares.filter(e => e.kind === 'saving').reduce((a, e) => a + (e.byMember[m.id] ?? 0), 0);
      const a = pay(m, false), b = pay(m, true), drop = (a.takeHome - b.takeHome) / 12, f = fund(m);
      const bank = (monthly, base, y) => B.project({ monthly, start: m.bankStart, annualRate: m.bankRate, taxRate: m.taxInterest ? B.marginalRate(base, S.year) : 0, years: y });
      // ponytail: extra super fees approximated as % fees on the extra balance only (fixed fee is paid anyway, cap ignored).
      const sup = y => B.project({ monthly: m.sacrifice * 0.85, annualRate: f.returns ? f.returns[HORIZONS.indexOf(y)] : m.superReturn, years: y, yearlyFee: bal => bal * (f.pctAUM + f.investFee) });
      return [`savings-${i}`, `<p class="note">Saving ${$(saving)}/month${m.sacrifice ? `, or ${$(saving - drop)}/month in the bank with sacrifice` : ''}.</p>
        <table><tr><th></th>${HORIZONS.map(y => `<th>${y} yr</th>`).join('')}</tr>
        <tr><td>Bank, no sacrifice</td>${HORIZONS.map(y => `<td>${$(bank(saving, a.base, y))}</td>`).join('')}</tr>
        ${m.sacrifice ? `<tr><td>Bank, with sacrifice</td>${HORIZONS.map(y => `<td>${$(bank(saving - drop, b.base - m.sacrifice * 12, y))}</td>`).join('')}</tr>
        <tr><td>Extra super</td>${HORIZONS.map(y => `<td>${$(sup(y))}</td>`).join('')}</tr>
        <tr class="sub"><td>FHSS releasable</td>${HORIZONS.map(y => `<td>${$(B.fhssRelease(m.sacrifice, y))}</td>`).join('')}</tr>
        <tr class="total"><td>Bank + FHSS</td>${HORIZONS.map(y => `<td>${$(bank(saving - drop, b.base - m.sacrifice * 12, y) + B.fhssRelease(m.sacrifice, y))}</td>`).join('')}</tr>` : ''}
        </table>`];
    })),
  },

  house: {
    title: 'House',
    form: () => `<div data-out="house"></div><section><details data-d="property"><summary>Property</summary>
      ${num('house.value', 'Property value')}
      ${pctIn('house.depositPct', 'Your deposit %')}
      ${pctIn('house.govPct', 'Government contribution %')}
      ${chk('house.firstHome', 'First home buyer')}
      ${pctIn('house.rate', 'Interest rate % p.a.')}
      ${num('house.years', 'Loan term (years)', 1)}</details></section>
      <section><details data-d="fees"><summary>Up-front fees</summary>
      ${num('house.rego', 'Mortgage registration')}${num('house.title', 'Title search')}${num('house.conveyancing', 'Conveyancing')}</details></section>
      <section><details data-d="cash" open><summary>Cash for the purchase</summary>
      ${sel('house.buyIn', 'Buying in', [[0, 'Now'], [1, '1 year'], [3, '3 years'], [5, '5 years']])}
      ${chk('house.useSacrifice', 'Using salary sacrifice + FHSS')}
      ${num('house.stocks', 'Stocks / investments')}${num('house.gift', 'Family gift')}${num('house.extras', 'Anything else')}
      ${num('house.cushion', 'Cash cushion to keep')}</details></section>`,
    out: () => {
      const h = S.house, y = +h.buyIn, sac = h.useSacrifice, { shares } = budget(scn());
      const deposit = h.value * h.depositPct, gov = h.value * h.govPct, loan = h.value - deposit - gov;
      const duty = B.stampDuty(h.value, h.firstHome), transfer = 102.4 + Math.ceil(h.value / 1000) * 2.34;
      const upfront = deposit + duty + transfer + h.rego + h.title + h.conveyancing;
      const cash = S.members.reduce((t, m) => {
        if (!y) return t + m.bankStart;
        const a = pay(m, false), b = pay(m, true), drop = sac ? (a.takeHome - b.takeHome) / 12 : 0;
        const saving = shares.filter(e => e.kind === 'saving').reduce((s, e) => s + (e.byMember[m.id] ?? 0), 0);
        const base = sac ? b.base - m.sacrifice * 12 : a.base;
        return t + B.project({ monthly: saving - drop, start: m.bankStart, annualRate: m.bankRate, taxRate: m.taxInterest ? B.marginalRate(base, S.year) : 0, years: y })
          + (sac ? B.fhssRelease(m.sacrifice, y) : 0);
      }, 0) + h.stocks + h.gift + h.extras - h.cushion;
      const monthly = B.repayment(loan, h.rate, h.years), income = budget(scn()).sum.household.income;
      return { house: `<section><h2>Purchase</h2>${rows([
        ['Your deposit', deposit], ['Government contribution', gov], ['Loan', loan], ['Loan to value', pct(loan / h.value)],
        ['Stamp duty (VIC)', duty], ['Transfer fee', transfer], ['Total up-front', upfront, 'total'],
        [`Cash available${y ? ` in ${y} yr` : ''}`, cash], [cash >= upfront ? 'Extra cash' : 'Missing cash', cash - upfront, 'total']])}</section>
        <section><h2>Repayments</h2>${rows([
        ['Monthly repayment', monthly, 'total'], ['Fortnightly (approx.)', monthly * 12 / 26],
        ['Share of household take-home', pct(monthly / (income || 1))],
        ['Total interest over the loan', B.payoff({ loan, rate: h.rate, years: h.years }).interest]])}</section>` };
    },
  },

  goals: {
    title: 'Goals',
    form: () => `<section><h2>Emergency fund</h2>${num('goals.emergencyMonths', 'Months of costs to hold', 1)}<div data-out="emergency"></div></section>
      <section><h2>Mortgage: repay or save?</h2>
      <p class="note">Uses the loan from the House tab. Extra money each month goes to extra repayments, an offset account, or half each.</p>
      ${num('goals.extra', 'Extra each month')}<div data-out="mortgage"></div></section>`,
    out: () => {
      const { household: h } = budget(scn()).sum, fundSize = h.costs * S.goals.emergencyMonths;
      const months = h.savings > 0 ? Math.ceil(fundSize / h.savings) : null;
      const hs = S.house, loan = hs.value * (1 - hs.depositPct - hs.govPct), x = S.goals.extra;
      const base = B.payoff({ loan, rate: hs.rate, years: hs.years });
      const ym = n => `${Math.floor(n / 12)} yr ${n % 12} mo`;
      const opt = (label, extra, offset) => { const r = B.payoff({ loan, rate: hs.rate, years: hs.years, extra, offset });
        return `<tr><td>${label}</td><td>${ym(r.months)}</td><td>${$(base.interest - r.interest)}</td><td>${$(r.offset)}</td></tr>`; };
      return {
        emergency: rows([['Monthly costs', h.costs], ['Target', fundSize, 'total'],
          ['Time to save it', months == null ? 'Not saving' : ym(months)]]) + '<p class="note">Saving at the household savings-goal rate from the active budget.</p>',
        mortgage: `<table><tr><th></th><th>Paid off in</th><th>Interest saved</th><th>Offset built up</th></tr>
          <tr><td>No extra</td><td>${ym(base.months)}</td><td>${$(0)}</td><td>${$(0)}</td></tr>
          ${opt('All to repayments', x, 0)}${opt('All to offset', 0, x)}${opt('Half each', x / 2, x / 2)}</table>
          <p class="note">An offset saves the same interest as extra repayments, but the money stays yours to use until you pay out the loan.</p>`,
      };
    },
  },
};

// --- render & events ---------------------------------------------------------
const view = document.getElementById('view');
function renderOut() {
  const out = TABS[S.tab].out();
  for (const [k, html] of Object.entries(out)) { const el = view.querySelector(`[data-out="${k}"]`); if (el) el.innerHTML = html; }
}
function render() {
  document.getElementById('year').innerHTML = opts(Object.keys(B.RATES).map(y => [y, `Tax ${y}`]), S.year);
  document.getElementById('tabs').innerHTML = Object.entries(TABS).map(([k, t]) => `<button data-tab="${k}" aria-pressed="${k === S.tab}">${t.title}</button>`).join('')
    + '<button data-tab="data" aria-pressed="false">Backup</button>';
  view.innerHTML = TABS[S.tab].form();
  for (const d of view.querySelectorAll('details')) if (d.dataset.d in openDetails) d.open = openDetails[d.dataset.d];
  renderOut();
}
const openDetails = {}; // which folded sections are open, kept across re-renders
view.addEventListener('toggle', e => { openDetails[e.target.dataset.d] = e.target.open; }, true);
function read(el) {
  if (el.type === 'checkbox') return el.checked;
  if (el.type === 'number') { const n = parseFloat(el.value) || 0; return 'pct' in el.dataset ? n / 100 : n; }
  return el.tagName === 'SELECT' && /^\d+$/.test(el.value) && !/owner/.test(el.dataset.k) ? +el.value : el.value;
}
view.addEventListener('input', e => { const el = e.target; if (el.dataset.k && el.type === 'number') { set(el.dataset.k, read(el)); save(); renderOut(); } });
view.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.act === 'pick') { S.active = +el.value; save(); return render(); }
  if (el.dataset.k && el.type !== 'number') { set(el.dataset.k, read(el)); save(); render(); }
});
view.addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const list = b.dataset.list && get(b.dataset.list);
  if (b.dataset.act === 'add') list.push(b.dataset.list.endsWith('costs') ? { name: 'New cost', owner: '', amount: 0, cycle: 'monthly' } : { name: 'New allocation', amount: 0, kind: 'saving' });
  if (b.dataset.act === 'del') list.splice(+b.dataset.i, 1);
  if (b.dataset.act === 'dupScenario') { S.scenarios.push({ ...structuredClone(scn()), name: `${scn().name} (copy)` }); S.active = S.scenarios.length - 1; }
  if (b.dataset.act === 'delScenario' && confirm(`Delete "${scn().name}"?`)) { S.scenarios.splice(S.active, 1); S.active = 0; }
  save(); render();
});
document.getElementById('year').onchange = e => { S.year = e.target.value; save(); render(); };
document.getElementById('tabs').onclick = e => {
  const t = e.target.closest('button')?.dataset.tab; if (!t) return;
  if (t === 'data') return backup();
  S.tab = t; save(); render();
};

// Everything lives in this browser; export a file to keep a copy or move it to another device.
function backup() {
  for (const b of document.querySelectorAll('#tabs button')) b.setAttribute('aria-pressed', b.dataset.tab === 'data');
  view.innerHTML = `<section><h2>Backup</h2>
    <p class="note">Your numbers are saved only in this browser. Export a file to keep a copy or move to another device.</p>
    <div class="menu"><button class="small" id="exp">Export file</button>
    <label class="small" style="display:inline-flex"><span>Import file</span> <input type="file" id="imp" accept="application/json"></label>
    <button class="small" id="reset">Reset to sample numbers</button></div></section>
    <section><h2>Spreadsheet</h2>
    <p class="note">Download your numbers in the original Budgeting + First Home Super Sacrifice workbook. Open it in Excel or upload it to Google Sheets. It uses its own formulas (2024-25 tax rules) and holds two members, the first two variations and up to 11 costs per column.</p>
    <div class="menu"><button class="small" id="xlsx">Download spreadsheet (.xlsx)</button></div></section>`;
  const download = (blob, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); };
  document.getElementById('exp').onclick = () => download(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' }), 'fudget-backup.json');
  document.getElementById('xlsx').onclick = async () => {
    try {
      const { shares } = budget(scn()); // Savings Goals per Member, as on the Savings tab
      const saving = Object.fromEntries(S.members.map(m => [m.id, shares.filter(e => e.kind === 'saving').reduce((a, e) => a + (e.byMember[m.id] ?? 0), 0)]));
      const res = await fetch('budget-template.xlsx');
      if (!res.ok) throw new Error(`template ${res.status}`);
      const xlsx = await fillWorkbook(new Uint8Array(await res.arrayBuffer()), workbookCells(S, saving));
      download(new Blob([xlsx], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), 'Budgeting + First Home Super Sacrifice.xlsx');
    } catch (err) { alert(`Couldn't build the spreadsheet: ${err.message}`); }
  };
  document.getElementById('imp').onchange = async e => {
    try {
      const data = JSON.parse(await e.target.files[0].text());
      if (!Array.isArray(data.members) || !Array.isArray(data.scenarios)) throw new Error('not a Fudget backup');
      S = { ...structuredClone(DEFAULTS), ...data }; save(); render();
    } catch (err) { alert(`Couldn't import: ${err.message}`); }
  };
  document.getElementById('reset').onclick = () => { if (confirm('Replace all your numbers with the sample ones?')) { S = structuredClone(DEFAULTS); save(); render(); } };
}

render();
</script>
</body>
